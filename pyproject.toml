[project]
name = "yt-mcp-server-ha-plugin"
version = "0.1.1"
description = "Home Assistant integration for a yt-mcp server (health and playlist analytics)"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "SIM", "RUF"]
ignore = ["RUF012"]
